[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-anatomia-3d"
version = "0.3.0"
description = "Atlas anatômico 3D local para estudo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
windows = ["pyinstaller>=6.11"]

[project.scripts]
anatomia-3d = "anatomia_app.main:main"
anatomia-dados = "anatomia_app.bodyparts3d:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anatomia_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
